services:
  - type: web
    name: deposit-saving-web-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: FINLIFE_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./financial_products.db
      - key: SYNC_ON_STARTUP
        value: false
      - key: ADMIN_TOKEN
        sync: false

  - type: web
    name: deposit-saving-web
    runtime: static
    rootDir: frontend
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: deposit-saving-web-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
